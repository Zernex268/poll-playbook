<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>SurveyHub - Онлайн платформа для опросов</title>
    <meta name="description" content="Создавайте онлайн опросы, собирайте ответы и анализируйте результаты с SurveyHub. Современная платформа для проведения опросов." />
    <meta name="author" content="SurveyHub" />
    <meta name="keywords" content="онлайн опросы, создание опросов, анкетирование, исследование, сбор данных" />

    <meta property="og:title" content="SurveyHub - Онлайн платформа для опросов" />
    <meta property="og:description" content="Создавайте онлайн опросы, собирайте ответы и анализируйте результаты с SurveyHub" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
